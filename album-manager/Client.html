<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><style>
:root{color-scheme:dark;--bg:#171311;--panel:#211c19;--gold:#d7b77a;--muted:#b9ada2;--line:#ffffff20;--white:#fffaf3}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at 50% 0%,#55402a66,transparent 48%),var(--bg);color:var(--white);font:15px Arial,sans-serif}.card{width:min(100%,440px);padding:clamp(22px,6vw,38px);background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 70px #0004}.logo{margin:0 auto 15px;width:58px;height:58px;display:grid;place-items:center;border:1px solid #d7b77a88;border-radius:50%;color:var(--gold);font:26px Georgia,serif}.brand,.tag{text-align:center}.brand{color:var(--gold);font-weight:bold;letter-spacing:4px}.tag{color:var(--muted);font-size:10px;letter-spacing:2px;margin-top:7px}h1{text-align:center;font:500 38px Georgia,serif;margin:30px 0 8px}p{text-align:center;color:var(--muted);line-height:1.7;font-size:13px;margin:0 0 24px}label{display:block;color:var(--muted);font-size:12px;margin:0 0 7px}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:9px;background:#151210;color:var(--white);font-size:16px;margin-bottom:16px}button{width:100%;border:0;border-radius:9px;padding:14px;background:var(--gold);color:#211810;font-weight:bold;font-size:14px;cursor:pointer}.msg{margin-top:14px;padding:12px;border-radius:9px;background:#ffffff0b;color:var(--muted);font-size:13px;line-height:1.6}.error{border:1px solid #d77b7b55;color:#ffc3c3}.foot{text-align:center;color:#95877b;font-size:10px;margin-top:24px}</style></head><body><main class="card"><div class="logo">SP</div><div class="brand">SARITA PHOTO</div><div class="tag">YOUR PRIVATE WEDDING ALBUM</div><h1>Welcome Back</h1><p>Enter the mobile number and album access code shared by your photographer.</p><form id="f"><label>Mobile number</label><input id="phone" inputmode="numeric" autocomplete="tel" maxlength="10" minlength="10" pattern="[0-9]{10}" required placeholder="10-digit mobile number"><label>Album access code</label><input id="code" autocomplete="one-time-code" maxlength="8" minlength="8" required placeholder="8-character code" style="text-transform:uppercase;letter-spacing:3px"><button>OPEN MY ALBUM ↗</button></form><div id="m" class="msg" hidden></div><div class="foot">SARITA PHOTO · Creating Timeless Wedding Stories Since 1985</div></main><script>$('f');function $(x){return document.getElementById(x)}$('f').onsubmit=e=>{e.preventDefault();let m=$('m');m.hidden=false;m.className='msg';m.textContent='Verifying…';google.script.run.withSuccessHandler(r=>{m.textContent='Welcome, '+r.name+'. Opening album…';window.top.location.href=r.url;}).withFailureHandler(err=>{m.className='msg error';m.textContent=err&&err.message||'Could not verify details.';}).clientLogin($('phone').value,$('code').value)};</script></body></html>
